{% extends "conductor/base_conductor.html" %}
{% block titulo %}Cargar gasto · UBICAR{% endblock %}

{% block contenido %}
<h2 style="font-size:16px;margin:4px 0 14px">Cargar gasto</h2>
<form class="tarjeta" id="form">
  <div class="ayuda" id="viaje-info" style="margin-bottom:14px">Buscando viaje en curso…</div>
  <div class="campo">
    <label>Tipo</label>
    <select id="tipo" required><option value="">Seleccionar tipo</option></select>
  </div>
  <div class="campo">
    <label>Monto</label>
    <div class="prefijo"><span>$</span><input id="monto" type="number" step="0.01" min="0.01" placeholder="0.00" required></div>
  </div>
  <div class="campo">
    <label>Kilometraje actual del vehículo</label>
    <input id="km" type="number" min="0" required>
  </div>
  <div class="campo">
    <label>Comprobante</label>
    <label class="subir"><input id="comprobante" type="file" accept="image/*" capture="environment"><div id="subir-texto">🖼<br>Subir imagen</div></label>
  </div>
  <div class="error-msg oculto" id="error"></div>
  <button class="btn btn-azul btn-ancho" id="enviar" type="submit" style="padding:15px">Cargar Gasto</button>
</form>
{% endblock %}

{% block script_pantalla %}
<script>
(async () => {
  const me = await Conductor.iniciar();
  if (!me) return;
  const $ = id => document.getElementById(id);
  const NOMBRES = { COMBUSTIBLE: 'Combustible', PEAJE: 'Peaje', OTROS: 'Otros' };

  // El backend asocia el gasto al viaje activo del conductor; acá solo se informa cuál es.
  const [tipos, activo] = await Promise.all([API.get('/api/tipos-gasto/'), Conductor.viajeActivo()]);
  tipos.forEach(t => $('tipo').add(new Option(NOMBRES[t.razon_del_gasto] || t.razon_del_gasto, t.idTipoDeGasto)));
  if (activo) {
    $('viaje-info').innerHTML = `Se asocia al viaje en curso <b>${Conductor.numero(activo.id_viaje)}</b> · ${F.texto(activo.ruta.origen)} → ${F.texto(activo.ruta.destino)}`;
  } else {
    $('viaje-info').innerHTML = 'Los gastos se cargan durante un viaje activo. <a href="/conductor/nuevo-viaje/" style="color:var(--azul)">Iniciar viaje</a>';
    $('enviar').disabled = true;
  }
  if (me.vehiculo_asignado) $('km').value = me.vehiculo_asignado.kilometraje;

  // Vista previa de la foto elegida.
  $('comprobante').onchange = e => {
    const f = e.target.files[0];
    if (f) $('subir-texto').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="comprobante"><br><span class="ayuda">${F.texto(f.name)}</span>`;
  };

  // Se manda como FormData (multipart) porque lleva un archivo.
  $('form').onsubmit = async e => {
    e.preventDefault();
    $('error').classList.add('oculto');
    if (!$('comprobante').files[0]) { $('error').textContent = 'Adjuntá la foto del comprobante.'; $('error').classList.remove('oculto'); return; }
    $('enviar').disabled = true;
    const datos = new FormData();
    datos.append('tipo', $('tipo').value);
    datos.append('monto', $('monto').value);
    datos.append('km_registrado', $('km').value);
    datos.append('comprobante', $('comprobante').files[0]);
    try {
      const gasto = await API.post('/api/gasto/', datos);
      // El backend ya lo validó contra los km del GPS: VALIDADO o A_REVISAR.
      aviso(gasto.estado_nombre === 'VALIDADO' ? 'Gasto cargado y validado' : 'Gasto cargado, queda a revisar por el administrador');
      setTimeout(() => location.href = '/conductor/gastos/', 1200);
    } catch (ex) { $('error').textContent = ex.message; $('error').classList.remove('oculto'); $('enviar').disabled = false; }
  };
})();
</script>
{% endblock %}
