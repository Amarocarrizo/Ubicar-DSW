<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoreo de Flota - Ubicar</title>

    <!-- CSS de Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>

        #map {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

    </style>

</head>


<body>

    <h2>Monitoreo de Rutas</h2>

    <div id="map"></div>

    <br>


    <label>Localidad Partida</label>

    <input
        id="buscadorO"
        type="text"
    />

    <button id="origen">
        Origen
    </button>


    <br><br>


    <label>Localidad Destino</label>

    <input
        id="buscadorD"
        type="text"
    />

    <button id="destino">
        Destino
    </button>


    <br><br>


    <button id="boton">
        Calcular Ruta
    </button>



    <!-- Leaflet -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>


    <!-- Turf -->
    <script
        src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js">
    </script>



    <script>

        // =========================
        // MAPA
        // =========================

        var map = L.map('map').setView(
            [-34.16327, -58.95919],
            13
        );


        L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles &copy; Esri &mdash; OpenStreetMap'
            }
        ).addTo(map);



        // =========================
        // VARIABLES
        // =========================

        let marcadorActualO = null;

        let marcadorActualD = null;

        let routeLayer = null;


        let coordsOrigen = null;

        let coordsDestino = null;



        let buscadorO =
            document.getElementById('buscadorO');


        let buscadorD =
            document.getElementById('buscadorD');


        let origen =
            document.getElementById('origen');


        let destino =
            document.getElementById('destino');


        let btnCalcular =
            document.getElementById('boton');



        // =========================
        // BUSCAR ORIGEN
        // =========================

        origen.addEventListener(
            "click",

            async function () {

                let busqueda =
                    buscadorO.value.trim();


                let resultado =
                    await getInfo(busqueda);


                if (
                    resultado &&
                    resultado.length > 0
                ) {

                    coordsOrigen =
                        actualizarMarcadorO(
                            resultado[0]
                        );

                } else {

                    alert(
                        "No existe la localidad"
                    );

                }

            }
        );



        // =========================
        // BUSCAR DESTINO
        // =========================

        destino.addEventListener(
            "click",

            async function () {

                let busqueda =
                    buscadorD.value.trim();


                let resultado =
                    await getInfo(busqueda);


                if (
                    resultado &&
                    resultado.length > 0
                ) {

                    coordsDestino =
                        actualizarMarcadorD(
                            resultado[0]
                        );

                } else {

                    alert(
                        "No existe la localidad"
                    );

                }

            }
        );



        // =========================
        // BOTON CALCULAR RUTA
        // =========================

        btnCalcular.addEventListener(
            "click",

            async function () {
                if (!coordsOrigen && buscadorO.value.trim()) {
                    let resO = await getInfo(buscadorO.value.trim());
                    if (resO && resO.length > 0) {
                        coordsOrigen = actualizarMarcadorO(resO[0]);
                    }
                }
                if (!coordsDestino && buscadorD.value.trim()) {
                    let resD = await getInfo(buscadorD.value.trim());
                    if (resD && resD.length > 0) {
                        coordsDestino = actualizarMarcadorD(resD[0]);
                    }
                }
                intentarTrazarRuta();
            }
        );



        // =========================
        // NOMINATIM
        // =========================

        const getInfo = async (a) => {

            let peticion = await fetch(

                `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(a)}&countrycodes=ar&format=json&limit=1`

            );


            return await peticion.json();

        };



        // =========================
        // MARCADOR ORIGEN
        // =========================

        const actualizarMarcadorO = (json) => {

            let nombre =
                json.display_name;


            let latitud =
                parseFloat(json.lat);


            let longitud =
                parseFloat(json.lon);


            map.setView(
                [latitud, longitud],
                10
            );


            if (marcadorActualO) {

                map.removeLayer(
                    marcadorActualO
                );

            }


            marcadorActualO = L.marker(
                [latitud, longitud]
            )
            .addTo(map)
            .bindPopup(
                "Origen: " + nombre
            )
            .openPopup();


            return [
                latitud,
                longitud
            ];

        };



        // =========================
        // MARCADOR DESTINO
        // =========================

        const actualizarMarcadorD = (json) => {

            let nombre =
                json.display_name;


            let latitud =
                parseFloat(json.lat);


            let longitud =
                parseFloat(json.lon);


            map.setView(
                [latitud, longitud],
                10
            );


            if (marcadorActualD) {

                map.removeLayer(
                    marcadorActualD
                );

            }


            marcadorActualD = L.marker(
                [latitud, longitud]
            )
            .addTo(map)
            .bindPopup(
                "Destino: " + nombre
            )
            .openPopup();


            return [
                latitud,
                longitud
            ];

        };



        // =========================
        // CALCULAR RUTA
        // =========================

        const intentarTrazarRuta = async () => {


            if (
                coordsOrigen &&
                coordsDestino
            ) {


                let url =

                    `https://router.project-osrm.org/route/v1/driving/${coordsOrigen[1]},${coordsOrigen[0]};${coordsDestino[1]},${coordsDestino[0]}?overview=full&geometries=geojson`;



                try {


                    // =========================
                    // PEDIR RUTA A OSRM
                    // =========================

                    let response =
                        await fetch(url);


                    let data =
                        await response.json();



                    if (
                        data.routes &&
                        data.routes.length > 0
                    ) {


                        let routeGeoJson =
                            data.routes[0].geometry;


                        let distanciaKm =
                            data.routes[0].distance
                            / 1000;


                        let duracionMinutos =
                            data.routes[0].duration
                            / 60;



                        // =========================
                        // DIBUJAR RUTA
                        // =========================

                        if (routeLayer) {

                            map.removeLayer(
                                routeLayer
                            );

                        }


                        routeLayer =
                            L.geoJSON(
                                routeGeoJson,
                                {

                                    style: {

                                        color: '#3388ff',

                                        weight: 5,

                                        opacity: 0.8

                                    }

                                }
                            ).addTo(map);



                        map.fitBounds(

                            routeLayer.getBounds(),

                            {
                                padding:
                                    [50, 50]
                            }

                        );



                        console.log(

                            `Distancia estimada: ${distanciaKm.toFixed(2)} km`

                        );



                        // =========================
                        // 1. GUARDAR RUTA EN DJANGO
                        // =========================

                        let respuestaRuta =
                            await fetch(

                                'http://127.0.0.1:8000/api/ruta/',

                                {

                                    method: 'POST',

                                    headers: {

                                        'Content-Type':
                                            'application/json'

                                    },


                                    body:
                                        JSON.stringify({

                                            origen:
                                                buscadorO
                                                .value
                                                .trim(),

                                            destino:
                                                buscadorD
                                                .value
                                                .trim(),

                                            distancia_estimada:
                                                distanciaKm
                                                .toFixed(2),

                                            tiempo_estimado:
                                                duracionMinutos
                                                .toFixed(2),

                                            geometria_ruta:
                                                routeGeoJson

                                        })

                                }

                            );



                        // =========================
                        // RUTA CREADA
                        // =========================

                        if (respuestaRuta.ok) {


                            let rutaCreada =
                                await respuestaRuta.json();


                            console.log(

                                "¡Ruta guardada con éxito! ID:",

                                rutaCreada.id_ruta

                            );



                            // =========================
                            // TOKEN DEL USUARIO
                            // =========================

                            let token =
                                localStorage.getItem(
                                    'access_token'
                                );


                            if (!token) {

                                alert(
                                    "No hay un usuario logueado"
                                );

                                return;

                            }



                            // =========================
                            // 2. CREAR VIAJE
                            // =========================

                            let respuestaViaje =
                                await fetch(

                                    'http://127.0.0.1:8000/api/viaje/',

                                    {

                                        method:
                                            'POST',

                                        headers: {

                                            'Content-Type':
                                                'application/json',

                                            'Authorization':
                                                `Bearer ${token}`

                                        },


                                        body:
                                            JSON.stringify({

                                                id_ruta:
                                                    rutaCreada.id_ruta,

                                                estado:
                                                    "PENDIENTE"

                                            })

                                    }

                                );



                            // =========================
                            // VIAJE CREADO
                            // =========================

                            if (
                                respuestaViaje.ok
                            ) {


                                let viajeCreado =
                                    await respuestaViaje.json();


                                console.log(

                                    "Viaje creado. ID:",

                                    viajeCreado.id_viaje

                                );



                                // =========================
                                // 3. INICIAR VIAJE
                                // =========================

                                let respuestaInicio =
                                    await fetch(

                                        `http://127.0.0.1:8000/api/viaje/${viajeCreado.id_viaje}/iniciar/`,

                                        {

                                            method:
                                                'POST',

                                            headers: {

                                                'Content-Type':
                                                    'application/json',

                                                'Authorization':
                                                    `Bearer ${token}`

                                            },


                                            body:
                                                JSON.stringify({

                                                    latitud:
                                                        coordsOrigen[0],

                                                    longitud:
                                                        coordsOrigen[1]

                                                })

                                        }

                                    );



                                // =========================
                                // VIAJE INICIADO
                                // =========================

                                if (
                                    respuestaInicio.ok
                                ) {


                                    let inicio =
                                        await respuestaInicio.json();


                                    console.log(

                                        "Viaje iniciado correctamente:",

                                        inicio

                                    );


                                    alert(

                                        "¡Ruta guardada y viaje iniciado correctamente!"

                                    );


                                } else {


                                    let errorInicio =
                                        await respuestaInicio.json();


                                    console.error(

                                        "Error al iniciar el viaje:",

                                        errorInicio

                                    );


                                    alert(

                                        "El viaje se creó pero no pudo iniciarse: "
                                        +
                                        JSON.stringify(
                                            errorInicio
                                        )

                                    );

                                }



                            } else {


                                let errorViaje =
                                    await respuestaViaje.json();


                                console.error(

                                    "Error al crear el viaje:",

                                    errorViaje

                                );


                                alert(

                                    "Ruta guardada, pero falló la creación del viaje: "
                                    +
                                    JSON.stringify(
                                        errorViaje
                                    )

                                );

                            }



                        } else {


                            let errorData =
                                await respuestaRuta.json();


                            console.error(

                                "Django rechazó los datos de la ruta:",

                                errorData

                            );


                            alert(

                                "No se pudo guardar la ruta"

                            );

                        }



                    } else {


                        alert(

                            "No se encontró una ruta por carretera entre estos puntos."

                        );

                    }



                } catch (error) {


                    console.error(

                        "Error al conectar:",

                        error

                    );


                    alert(

                        "Ocurrió un error al conectar con el servidor."

                    );

                }



            } else {


                alert(

                    "Por favor selecciona primero un Origen y un Destino válidos."

                );

            }

        };


    </script>

</body>

</html>
